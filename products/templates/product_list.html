{% extends 'base.html' %}
{% block title %}Inventario de Produtos | SGE{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title d-flex align-items-center gap-2">
            <h5 class="fw-bold mb-0">Produtos</h5>
            <span class="fs-12 text-muted">Gerencie seu inventário e precificação de forma centralizada</span>
        </div>
    </div>
    <div class="page-header-right ms-auto">
        <div class="d-flex gap-2">
            <a href="?export=excel{% if request.GET.title %}&title={{ request.GET.title|urlencode }}{% endif %}" class="btn btn-outline-primary btn-sm" title="Exportar Excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
            <a href="?export=pdf{% if request.GET.title %}&title={{ request.GET.title|urlencode }}{% endif %}" class="btn btn-outline-primary btn-sm" title="Exportar PDF"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>
            <a href="{% url 'products:product_create' %}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Novo Produto
            </a>
        </div>
    </div>
</div>

<div class="card stretch stretch-full">
    <div class="card-body">
        <!-- Search & Filters -->
        <div class="filter-section">
            <div class="d-flex align-items-center mb-3">
                <div>
                    <h6 class="fw-bold text-dark mb-0">Filtros</h6>
                    <span class="fs-12 text-muted">Refine sua busca</span>
                </div>
                <button type="button" class="btn btn-link text-decoration-none ms-auto" data-bs-toggle="collapse" data-bs-target="#filterCollapse" aria-label="Alternar filtros">
                    <i class="bi bi-chevron-down" id="filterToggleIcon"></i>
                </button>
            </div>
            
            <form method="get" id="filter-form"
                  hx-get="{% url 'products:product_list' %}"
                  hx-trigger="submit, change, keyup delay:350ms changed"
                  hx-target="#product-table-wrapper"
                  hx-swap="innerHTML"
                  hx-push-url="true"
                  class="collapse show" id="filterCollapse">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-search me-1"></i>Pesquisar
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" name="title" class="form-control border-start-0 ps-0" placeholder="Título do produto..." value="{{ filters.title }}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-grid me-1"></i>Categoria
                        </label>
                        <select name="category" class="form-select">
                            <option value="">Todas</option>
                            {% for c in categories %}<option value="{{ c.id }}" {% if filters.category == c.id|stringformat:"d" %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-tag me-1"></i>Marca
                        </label>
                        <select name="brand" class="form-select">
                            <option value="">Todas</option>
                            {% for b in brands %}<option value="{{ b.id }}" {% if filters.brand == b.id|stringformat:"d" %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-box-seam me-1"></i>Stock
                        </label>
                        <select name="stock_status" class="form-select">
                            <option value="">Todos</option>
                            <option value="ok" {% if filters.stock_status == 'ok' %}selected{% endif %}>Normal (&gt;10)</option>
                            <option value="low" {% if filters.stock_status == 'low' %}selected{% endif %}>Baixo (1-10)</option>
                            <option value="out" {% if filters.stock_status == 'out' %}selected{% endif %}>Esgotado (0)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">&nbsp;</label>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-funnel-fill me-1"></i>Filtrar
                        </button>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-currency-dollar me-1"></i>Preço min.
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">AO</span>
                            <input type="number" name="min_price" class="form-control border-start-0 ps-0" placeholder="0" value="{{ filters.min_price }}" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-currency-dollar me-1"></i>Preço max.
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">AO</span>
                            <input type="number" name="max_price" class="form-control border-start-0 ps-0" placeholder="999999" value="{{ filters.max_price }}" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-calendar-event me-1"></i>Data início
                        </label>
                        <input type="date" name="date_from" class="form-control" value="{{ filters.date_from }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">
                            <i class="bi bi-calendar-check me-1"></i>Data fim
                        </label>
                        <input type="date" name="date_to" class="form-control" value="{{ filters.date_to }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted fw-semibold mb-1">&nbsp;</label>
                        <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-circle me-1"></i>Limpar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="product-table-wrapper">
        {% include 'product_list_partial.html' %}
    </div>
</div>
{% endblock %}

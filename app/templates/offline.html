{% load static %}
<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Conexão - SGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b1120; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 3rem; text-align: center; max-width: 420px; }
        .icon { width: 80px; height: 80px; background: rgba(239,68,68,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h4 class="fw-bold mb-2">Sem Conexão</h4>
        <p class="text-muted mb-4">Parece que está offline. Algumas funcionalidades podem não estar disponíveis.</p>
        <button class="btn btn-primary" onclick="window.location.reload()">Tentar Novamente</button>
    </div>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Alterar Senha — SGE{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-title"><a href="{% url 'dashboard' %}" class="btn-action me-1" title="Voltar"><i class="bi bi-arrow-left"></i></a><div><h1 class="fw-bold mb-0 fs-5">Alterar Senha</h1><span class="text-muted small">Atualizar credenciais de acesso</span></div></div></div>
<div class="sge-form-card" style="max-width:440px;">
  <div class="card"><div class="card-body p-4">
    <form method="post">{% csrf_token %}
      {% for field in form %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
      <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-control" required>
      {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}
      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <a href="{% url 'dashboard' %}" class="btn btn-light">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}

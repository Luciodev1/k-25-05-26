{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE | Entrar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style nonce="{{ request.csp_nonce }}">
        body {
            background: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0) 70%);
            z-index: -1;
            filter: blur(60px);
            animation: move 20s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(0, 0); }
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .auth-logo {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-blob"></div>
    <div class="login-blob" style="top: 100%; left: 100%; background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);"></div>

    <div class="auth-card animate-up">
        <div class="text-center">
            <div class="auth-logo">K</div>
            <h2 class="fw-bold text-white mb-1" style="font-family: 'Outfit', sans-serif;">Bem-vindo</h2>
            <p class="text-muted small mb-5">Entre para gerir os seus stocks e contas.</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger border-0 small rounded-3 py-3 mb-4 animate-up" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
            <i class="bi bi-exclamation-circle-fill me-2"></i> Utilizador ou senha incorretos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-light small fw-bold text-uppercase opacity-75">Utilizador</label>
                <div class="position-relative">
                    <i class="bi bi-person position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" name="username" autofocus maxlength="150" required class="form-control bg-dark bg-opacity-25 border-white border-opacity-10 py-3 ps-5 text-white" placeholder="O seu utilizador">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-light small fw-bold text-uppercase opacity-75">Senha</label>
                <div class="position-relative">
                    <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="password" name="password" required class="form-control bg-dark bg-opacity-25 border-white border-opacity-10 py-3 ps-5 text-white" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-6">
                Entrar no Sistema <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-5">
            <p class="text-muted extra-small mb-0">© 2026 K - Gestão de Stocks. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Entradas — SGE{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <div class="page-header-icon bg-success bg-opacity-10 text-success"><i class="bi bi-arrow-down-left-square"></i></div>
    <div><h1 class="fw-bold mb-0 fs-5">Entradas</h1><span class="text-muted small">Registo de entradas de stock</span></div>
  </div>
  <a href="{% url 'inflows:inflow_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Nova Entrada</a>
</div>
<div class="card"><div class="card-body">
  <form method="get" class="row g-3 mb-4"
        hx-get="{% url 'inflows:inflow_list' %}"
        hx-trigger="submit"
        hx-target="#list-table-wrapper"
        hx-swap="innerHTML"
        hx-push-url="true">
    <div class="col-md-5"><div class="sge-search-group"><i class="bi bi-search"></i><input type="text" name="product" class="form-control" placeholder="Pesquisar por produto…" value="{{ request.GET.product }}"></div></div>
    <div class="col-md-5"><div class="sge-search-group"><i class="bi bi-search"></i><input type="text" name="supplier" class="form-control" placeholder="Pesquisar por fornecedor…" value="{{ request.GET.supplier }}"></div></div>
    <div class="col-md-2"><button type="submit" class="btn btn-outline-primary w-100">Filtrar</button></div>
  </form>
  <div id="list-table-wrapper">
    {% include 'inflow_list_partial.html' %}
  </div>
</div></div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Fornecedores — SGE{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-left d-flex align-items-center">
    <div class="page-header-title d-flex align-items-center gap-2">
      <h5 class="fw-bold mb-0"><i class="bi bi-truck me-1"></i> Fornecedores |</h5>
      <span class="fs-12 text-muted">Gestão de parceiros e abastecimento</span>
    </div>
  </div>
  <div class="page-header-right ms-auto">
    <a href="{% url 'suppliers:supplier_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Novo Fornecedor</a>
  </div>
</div>
<div class="card stretch stretch-full">
  <div class="card-body">
    <form method="get" class="row g-3 mb-4"
          hx-get="{% url 'suppliers:supplier_list' %}"
          hx-trigger="submit"
          hx-target="#list-table-wrapper"
          hx-swap="innerHTML"
          hx-push-url="true">
      <div class="col">
        <div class="sge-search-group"><i class="bi bi-search"></i><input type="text" name="name" class="form-control"
            placeholder="Pesquisar por nome do fornecedor…" value="{{ request.GET.name }}"></div>
      </div>
      <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Filtrar</button></div>
    </form>
    <div id="list-table-wrapper">
      {% include 'supplier_list_partial.html' %}
    </div>
  </div>
</div>
{% endblock %}

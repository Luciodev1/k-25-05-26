<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead><tr><th>Nome</th><th>Descrição</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
      {% for supplier in suppliers %}<tr>
        <td class="fw-semibold">{{ supplier.name }}</td>
        <td class="text-muted small">{{ supplier.description|truncatechars:100|default:"—" }}</td>
        <td class="text-end">
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'suppliers:supplier_detail' supplier.id %}" class="btn-action" title="Ver"><i class="bi bi-eye"></i></a>
            <a href="{% url 'accounts:supplier_account' supplier.id %}" class="btn-action text-accent" title="Conta Corrente"><i class="bi bi-wallet2"></i></a>
            <a href="{% url 'suppliers:supplier_update' supplier.id %}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
            <button type="button" class="btn btn-action text-danger" title="Eliminar" aria-label="Eliminar" data-bs-toggle="modal" data-bs-target="#deleteModal" data-delete-url="{% url 'suppliers:supplier_delete' supplier.id %}" data-delete-message="Tem certeza que deseja eliminar o fornecedor '{{ supplier.name }}'?"><i class="bi bi-trash3"></i></button>
          </div>
        </td>
      </tr>{% empty %}<tr><td colspan="3"><div class="sge-empty"><div class="sge-empty-icon"><i class="bi bi-truck"></i></div><div class="text-muted small">Nenhum fornecedor encontrado.</div></div></td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% include 'components/_pagination.html' %}

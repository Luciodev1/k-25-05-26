[pytest]
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts = --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=90 -q
testpaths = tests products inflows outflows payments accounts customers suppliers users audit reports brands categories drivers tenants app

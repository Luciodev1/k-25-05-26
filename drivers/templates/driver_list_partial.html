<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nome</th><th>Telefone</th><th>Matrícula Camião</th><th>Matrícula Cisterna</th><th class="text-end">Ações</th></tr></thead><tbody>
  {% for driver in drivers %}<tr>
    <td class="fw-semibold">{{ driver.name }}</td>
    <td class="small"><i class="bi bi-telephone me-1 text-muted"></i>{{ driver.phone }}</td>
    <td><span class="badge bg-body-secondary text-body">{{ driver.truck_plate }}</span></td>
    <td><span class="badge bg-body-secondary text-body">{{ driver.cistern_plate }}</span></td>
    <td class="text-end"><div class="d-flex justify-content-end gap-1">
      <a href="{% url 'drivers:driver_update' driver.pk %}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
      <button type="button" class="btn btn-action text-danger" title="Eliminar" data-bs-toggle="modal" data-bs-target="#deleteModal" data-delete-url="{% url 'drivers:driver_delete' driver.pk %}" data-delete-message="Tem certeza que deseja eliminar o motorista '{{ driver.name }}'?"><i class="bi bi-trash3"></i></button>
    </div></td>
  </tr>{% empty %}<tr><td colspan="5"><div class="sge-empty"><div class="sge-empty-icon"><i class="bi bi-person-badge"></i></div><div class="text-muted small">Nenhum motorista encontrado.</div></div></td></tr>{% endfor %}
</tbody></table></div>
{% include 'components/_pagination.html' %}

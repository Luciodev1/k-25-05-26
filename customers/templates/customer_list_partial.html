<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nome</th><th>Telefone</th><th>NIF</th><th>E-mail</th><th class="text-end">Ações</th></tr></thead><tbody>
  {% for customer in customers %}<tr>
    <td class="fw-semibold">{{ customer.name }}</td>
    <td class="small"><i class="bi bi-telephone me-1 text-muted"></i>{{ customer.phone|default:"—" }}</td>
    <td><span class="badge bg-body-secondary text-body">{{ customer.nif|default:"—" }}</span></td>
    <td class="text-muted small">{{ customer.email|default:"—" }}</td>
    <td class="text-end"><div class="d-flex justify-content-end gap-2">
      <a href="{% url 'customers:customer_detail' customer.id %}" class="btn-action" title="Ver"><i class="bi bi-eye"></i></a>
      <a href="{% url 'accounts:customer_account' customer.id %}" class="btn-action text-accent" title="Conta Corrente"><i class="bi bi-wallet2"></i></a>
      <a href="{% url 'customers:customer_update' customer.id %}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
      <button type="button" class="btn btn-action text-danger" title="Eliminar" aria-label="Eliminar" data-bs-toggle="modal" data-bs-target="#deleteModal" data-delete-url="{% url 'customers:customer_delete' customer.id %}" data-delete-message="Tem certeza que deseja eliminar o cliente '{{ customer.name }}'?"><i class="bi bi-trash3"></i></button>
    </div></td>
  </tr>{% empty %}<tr><td colspan="5"><div class="sge-empty"><div class="sge-empty-icon"><i class="bi bi-people"></i></div><div class="text-muted small">Nenhum cliente encontrado.</div></div></td></tr>{% endfor %}
</tbody></table></div>
{% include 'components/_pagination.html' %}

{% extends 'base.html' %}
{% block title %}Clientes — SGE{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <div class="page-header-icon bg-accent-soft text-accent"><i class="bi bi-people"></i></div>
    <div><h1 class="fw-bold mb-0 fs-5">Clientes</h1><span class="text-muted small">Gestão da carteira de clientes</span></div>
  </div>
  <a href="{% url 'customers:customer_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Novo Cliente</a>
</div>
<div class="card"><div class="card-body">
  <form method="get" class="row g-3 mb-4"
        hx-get="{% url 'customers:customer_list' %}"
        hx-trigger="submit"
        hx-target="#list-table-wrapper"
        hx-swap="innerHTML"
        hx-push-url="true">
    <div class="col"><div class="sge-search-group"><i class="bi bi-search"></i><input type="text" name="name" class="form-control" placeholder="Pesquisar por nome do cliente…" value="{{ request.GET.name }}"></div></div>
    <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Filtrar</button></div>
  </form>
  <div id="list-table-wrapper">
    {% include 'customer_list_partial.html' %}
  </div>
</div></div>
{% endblock %}

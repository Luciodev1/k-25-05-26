{% extends 'portal/base_portal.html' %}
{% block title %}Email Enviado - Portal do Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card stretch stretch-full">
            <div class="card-body p-4 text-center py-5">
                <div class="bg-soft-success text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-envelope-check fs-2"></i>
                </div>
                <h5 class="fw-bold mb-2">Email Enviado</h5>
                <p class="text-muted small mb-0">
                    Se o email existir na nossa base de dados, receberá instruções para redefinir a sua palavra-passe.
                </p>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="{% url 'portal:login' %}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
        </div>
    </div>
</div>
{% endblock %}

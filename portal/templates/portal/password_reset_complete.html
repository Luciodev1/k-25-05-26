{% extends 'portal/base_portal.html' %}
{% block title %}Palavra-passe Redefinida - Portal do Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center py-5">
                <div class="bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-check-circle fs-2"></i>
                </div>
                <h5 class="fw-bold mb-2">Palavra-passe Redefinida</h5>
                <p class="text-muted small mb-4">A sua palavra-passe foi alterada com sucesso.</p>
                <a href="{% url 'portal:login' %}" class="btn btn-success">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Entrar no Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

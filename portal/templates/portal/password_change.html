{% extends 'portal/base_portal.html' %}
{% block title %}Alterar Palavra-passe - Portal do Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4"><i class="bi bi-shield-lock me-2 text-primary"></i>Alterar Palavra-passe</h5>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" required id="{{ field.id_for_label }}">
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-flex gap-2">
                        <a href="{% url 'portal:dashboard' %}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                        <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-check-lg me-1"></i>Alterar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

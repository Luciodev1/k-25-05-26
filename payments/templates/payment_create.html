{% extends 'base.html' %}

{% block title %}Novo Pagamento | SGE{% endblock %}

{% block content %}

<div class="page-header"><div class="page-header-title"><a href="{% url 'payments:payment_list' %}" class="btn-action me-1"><i class="bi bi-arrow-left"></i></a><div><h1 class="fw-bold mb-0 fs-5">Registar Pagamento</h1><span class="text-muted small">Recebimentos e pagamentos</span></div></div></div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% include 'payments/_payment_form.html' %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Registar
                        </button>
                        <a href="{% url 'payments:payment_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

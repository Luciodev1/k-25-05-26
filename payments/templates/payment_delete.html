{% extends 'base.html' %}
{% block title %}Eliminar Pagamento — SGE{% endblock %}
{% block content %}
<div class="sge-delete-card"><div class="card"><div class="card-body p-5">
  <div class="sge-delete-icon"><i class="bi bi-trash3"></i></div><h5 class="fw-bold mb-2">Eliminar Pagamento?</h5>
  <p class="text-muted small mb-4">Tem a certeza que deseja eliminar este pagamento de <strong>{{ object.amount|floatformat:"2g" }}</strong>?<br>O saldo será revertido automaticamente.</p>
  <form method="post">{% csrf_token %}<div class="d-flex justify-content-center gap-2"><a href="{% url 'payments:payment_list' %}" class="btn btn-light px-4">Cancelar</a><button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash3 me-1"></i>Eliminar</button></div></form>
</div></div></div>
{% endblock %}

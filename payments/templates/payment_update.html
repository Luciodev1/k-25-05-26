{% extends 'base.html' %}

{% block title %}Editar Pagamento | SGE{% endblock %}

{% block content %}

<div class="page-header"><div class="page-header-left d-flex align-items-center"><div class="page-header-title d-flex align-items-center gap-2"><a href="{% url 'payments:payment_list' %}" class="btn-action me-1"><i class="bi bi-arrow-left"></i></a><h5 class="fw-bold mb-0">Editar Pagamento</h5><span class="fs-12 text-muted">Recebimentos e pagamentos</span></div></div></div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card stretch stretch-full">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% include 'payments/_payment_form.html' %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Guardar Alterações
                        </button>
                        <a href="{% url 'payments:payment_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

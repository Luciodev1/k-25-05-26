<div id="brand-list" hx-indicator="#brand-loading" class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead><tr><th scope="col">Nome</th><th scope="col">Descrição</th><th scope="col" class="text-end">Ações</th></tr></thead>
    <tbody>
      {% for brand in brands %}
      <tr>
        <td class="fw-semibold">{{ brand.name }}</td>
        <td class="text-muted small">{{ brand.description|truncatechars:100|default:"—" }}</td>
        <td class="text-end">
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'brands:brand_detail' brand.id %}" class="btn-action" title="Ver"><i class="bi bi-eye"></i></a>
            <a href="{% url 'brands:brand_update' brand.id %}" class="btn-action" title="Editar"><i class="bi bi-pencil"></i></a>
            <button type="button" class="btn btn-action text-danger" title="Eliminar" aria-label="Eliminar" data-bs-toggle="modal" data-bs-target="#deleteModal" data-delete-url="{% url 'brands:brand_delete' brand.id %}" data-delete-message="Tem certeza que deseja eliminar a marca '{{ brand.name }}'?"><i class="bi bi-trash3"></i></button>
          </div>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="3"><div class="sge-empty-state"><i class="bi bi-bookmark"></i><p class="fs-12 text-muted mb-0">Nenhuma marca encontrada.</p></div></td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<div id="brand-loading" class="htmx-indicator text-center py-3">
  <div class="spinner-border text-primary" role="status"><span class="visually-hidden">A carregar...</span></div>
</div>
{% include 'components/_pagination.html' %}

{% extends 'base.html' %}
{% block title %}Marcas — SGE{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <div class="page-header-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="bi bi-bookmark"></i></div>
    <div>
      <h1 class="fw-bold mb-0 fs-5">Marcas</h1>
      <span class="text-muted small">Gestão de fabricantes e marcas</span>
    </div>
  </div>
  <a href="{% url 'brands:brand_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Nova Marca</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="get" class="row g-3 mb-4"
          hx-get="{% url 'brands:brand_list' %}"
          hx-trigger="submit"
          hx-target="#list-table-wrapper"
          hx-swap="innerHTML"
          hx-push-url="true">
      <div class="col"><div class="sge-search-group"><i class="bi bi-search"></i><input type="text" name="name" class="form-control" placeholder="Pesquisar por nome da marca…" value="{{ request.GET.name }}"></div></div>
      <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Filtrar</button></div>
    </form>
    <div id="list-table-wrapper">
      {% include 'brand_list_partial.html' %}
    </div>
  </div>
</div>
{% endblock %}
